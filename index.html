<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lee Sieun's personal archive." />
    <title>LEE SIEUN / ARCHIVE</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="wordmark" href="/" aria-label="Lee Sieun Archive home"><span>LEE SIEUN</span> / ARCHIVE</a>
      <div class="explore-options" aria-label="Archive controls">
        <nav class="filter-nav" aria-label="View filter">
          <span class="control-label">View</span>
          <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="channel" aria-pressed="false">Channels</button>
          <button class="filter-button" type="button" data-filter="block" aria-pressed="false">Blocks</button>
        </nav>
        <nav class="sort-nav" aria-label="Sort archive">
          <span class="control-label">Sort</span>
          <button class="sort-button is-active" type="button" data-sort="recent" aria-pressed="true">Recently updated</button>
          <button class="sort-button" type="button" data-sort="random" aria-pressed="false">Random</button>
        </nav>
      </div>
    </header>

    <main>
      <section class="archive-grid" id="archive-grid" aria-label="Archive items"></section>
    </main>

    <template id="empty-state-template">
      <p class="empty-state">Nothing here yet.</p>
    </template>

    <script src="blocks.js"></script>
    <script src="app.js"></script>
  </body>
</html>
